  <title>Live Timeline</title>
  <script>
    // Start-up guard: if anything fails to load or throws, say so in the pane instead of leaving it blank.
    (function () {
      var pending = null;
      function show(msg) {
        var s = document.getElementById('status');
        if (!s) { pending = msg; return; }
        s.textContent = msg;
        s.className = 'status error';
      }
      window.__ltlShow = show;
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && (t.src || t.href)) {
          window.__ltlLoadError = 'Could not load ' + (t.src || t.href) + '. Check the internet connection, or that this file is on the hosting site.';
          show(window.__ltlLoadError);
        } else show('Problem: ' + ((e && e.message) || 'a script error'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        show('Problem: ' + ((r && r.message) || String(r)));
      });
      document.addEventListener('DOMContentLoaded', function () { if (pending) show(pending); });
    })();
  </script>

  <style>
/* Live Timeline task pane — Office-like look so it sits naturally next to PowerPoint. */
:root {
  --text: #242424; --muted: #616161; --line: #e0e0e0; --line2: #d1d1d1;
  --bg: #ffffff; --bg2: #f7f7f7; --primary: #0f6cbd; --primary-h: #115ea3;
  --warn-bg: #fff8e6; --warn: #8a5300; --err: #b10e1c; --ok: #0e700e;
  --late: #c62828; --early: #2e7d32;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.4 "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

#app { display: block; }
#stage { display: none; }
body.mode-preview #app { display: flex; align-items: flex-start; gap: 20px; padding: 20px; background: #eef0f3; min-height: 100vh; }
body.mode-preview #stage { display: block; flex: 1 1 auto; min-width: 0; position: sticky; top: 20px; }
body.mode-preview #pane { flex: 0 0 380px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.06); max-height: calc(100vh - 40px); overflow: auto; }
body.mode-preview .live, body.mode-preview #btnUpdate { display: none; }
.slide { background: #fff; border-radius: 6px; box-shadow: 0 2px 14px rgba(0,0,0,.12); overflow: hidden; line-height: 0; }
.slide svg { width: 100%; height: auto; display: block; }
.slide g[data-key] { cursor: pointer; }
@media (max-width: 980px) {
  body.mode-preview #app { flex-direction: column; padding: 12px 16px; }
  body.mode-preview #stage { position: static; width: 100%; }
  body.mode-preview #pane { flex: none; width: 100%; max-height: none; }
}

.pane-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.status { margin-top: 4px; font-size: 12px; color: var(--muted); min-height: 17px; }
.status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.error { color: var(--err); } .status.busy { color: var(--primary); }

.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; }
.toolbar .live { margin-left: 2px; }
.toolbar #btnUndo { margin-left: auto; }
.source { display: grid; grid-template-columns: 1fr 64px; gap: 8px; padding: 6px 14px 10px; border-bottom: 1px solid var(--line); }
.source label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }

.btn { border: 1px solid var(--line2); background: #fff; border-radius: 4px; padding: 5px 10px; cursor: pointer; line-height: 1.3; }
.btn:hover { background: #f5f5f5; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--primary-h); }
.btn.attention { box-shadow: 0 0 0 2px #ffd280; }
.btn.danger { color: var(--err); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

.in { border: 1px solid var(--line2); border-radius: 4px; padding: 4px 6px; background: #fff; width: 100%; min-width: 0; }
.in:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.in.bad { border-color: var(--err); background: #fff5f5; }
.in.num { width: 46px; text-align: center; }
.in.month { width: 92px; text-align: center; }
.in.mono, textarea.in { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 11px; resize: vertical; }
.hidden { display: none !important; }

#content { padding: 4px 0 24px; }
.card { margin: 10px 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 6px; background: #fff; }
.card.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px #ffd280; } 100% { box-shadow: 0 0 0 0 transparent; } }
.card-head { display: flex; align-items: flex-start; gap: 6px; }
.card-title { font-weight: 600; flex: 1 1 auto; min-width: 0; }
.shift { display: flex; gap: 4px; flex: none; }
.chip { border: 1px solid var(--line2); background: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; cursor: pointer; white-space: nowrap; }
.chip:hover { background: #f2f2f2; }
.chip.on { background: #e8f1fb; border-color: #8fb6e3; color: #0b4f8a; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

.chain { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
.pill { border-radius: 4px; padding: 1px 6px; font-size: 11px; white-space: nowrap; background: #f1f1f1; color: #333; }
.pill.p-ssd, .pill.p-pcd { background: #e9f5e3; color: #2f6b18; }
.pill.p-d { background: #244EA2; color: #fff; }
.pill.p-s { background: #E21860; color: #fff; }
.pill.p-fda { background: #fff4c7; color: #5c4700; border: 1px solid #f0d36a; }
.pill.p-acip { background: #f4f4f4; color: #333; }
.pill b.late { color: var(--late); } .pill b.early { color: var(--early); }

.grid { display: grid; gap: 6px; margin: 4px 0; }
.row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; }
.row .lbl { font-size: 12px; color: var(--muted); }
.row .ctl { min-width: 0; }
.hint { font-size: 11px; color: #8a8a8a; margin-top: 1px; }
.stepper { display: flex; align-items: center; gap: 3px; }
.step { width: 24px; height: 26px; border: 1px solid var(--line2); background: #fafafa; border-radius: 4px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
.step:hover { background: #eee; }
.suffix { font-size: 11px; color: var(--muted); margin-left: 4px; }
.check { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }

details.more { margin-top: 4px; }
details.more > summary { font-size: 12px; color: var(--primary); cursor: pointer; padding: 3px 0; }
details.sec { border-top: 1px solid var(--line); padding: 0 14px; }
details.sec > summary { cursor: pointer; font-weight: 600; padding: 10px 0; display: flex; align-items: center; gap: 6px; list-style: none; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: '\203A'; display: inline-block; width: 10px; transition: transform .15s; color: var(--muted); }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > :not(summary) { margin-bottom: 8px; }
.count { background: #eee; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 600; color: var(--muted); }
.count:empty { display: none; }
.help { color: var(--muted); font-size: 12px; margin: 4px 0; }
.help.small { font-size: 11px; }
.note { font-size: 12px; padding: 5px 8px; border-radius: 4px; background: var(--bg2); margin: 4px 0; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.card-warn .note { margin: 2px 0 4px; }
#warnings { margin: 6px 12px 0; }

.proposals { display: grid; gap: 4px; margin: 6px 0; }
.proposal { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; padding: 4px 6px; border-radius: 4px; background: var(--bg2); }
.proposal s { color: #8a8a8a; }
.row-inline { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.row-inline .in { flex: 1; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 3px 4px; }
.tbl td { border-bottom: 1px solid #f0f0f0; padding: 3px 4px; }
.tbl th:not(:first-child), .tbl td:not(:first-child) { white-space: nowrap; }
.tbl td.late { color: var(--late); font-weight: 600; } .tbl td.early { color: var(--early); font-weight: 600; }
ol.log { list-style: none; padding: 0; margin: 4px 0; display: grid; gap: 6px; }
ol.log li { font-size: 12px; padding: 0 0 6px; border-bottom: 1px solid #f0f0f0; }
ol.log li:last-child { border-bottom: 0; }
ol.log li.empty { border: 0; padding: 0; color: var(--muted); }
ol.log .meta { color: var(--muted); font-size: 11px; }
ol.log s { color: #8a8a8a; }
ol.log .src { font-size: 11px; color: #5b5b5b; font-style: italic; }
ul.rows { margin: 4px 0 8px; padding-left: 0; list-style: none; font-size: 12px; display: grid; gap: 2px; }
ul.rows li { padding: 2px 8px; background: var(--bg2); border-radius: 4px; }
.setup .card-title { margin-bottom: 4px; }
.ver { padding: 8px 14px 14px; font-size: 10px; color: #9a9a9a; }
body.mode-preview .ver { display: none; }

</style>
  <script>
/*
 * Live Timeline — scheduling rules engine.
 * Pure functions, no DOM and no Office.js, so the same code runs in the task pane,
 * in the browser preview and in Node tests.
 *
 * Dates are handled at month precision as a "month index": year * 12 + (month - 1).
 */
(function (root) {
  'use strict';

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var SCHEMA = 'live-timeline/1';

  var DEFAULT_RULES = {
    reviewPriority: 8,      // months from BLA submission to approval with priority review / PRV (60-day filing + 6-month goal)
    reviewStandard: 12,     // months from submission to approval with standard review (60-day filing + 10-month goal)
    acipMonths: [2, 6, 10], // months in which ACIP is assumed to meet
    acipMinGap: 1,          // ACIP vote at the first meeting at least this many months after approval
    readoutLag: 2,          // months from primary completion (PCD) to topline data
    submissionLag: 1,       // months from topline data to submission
    pointLabels: 'quarter'  // how D and S markers are labelled: 'quarter' or 'month'
  };

  // Scenario input fields, in the order used by the task pane, the team-update table and the change log.
  var FIELDS = [
    { key: 'studyName', label: 'Study name', type: 'text' },
    { key: 'ssd', label: 'Study start (SSD)', type: 'month' },
    { key: 'studyMonths', label: 'Study length (months, SSD to PCD)', type: 'int' },
    { key: 'readoutLag', label: 'Topline after PCD (months)', type: 'int', ruleDefault: 'readoutLag' },
    { key: 'submissionLag', label: 'Submission after topline (months)', type: 'int', ruleDefault: 'submissionLag' },
    { key: 'submission', label: 'Fixed submission date', type: 'month' },
    { key: 'priorityReview', label: 'Priority review / PRV', type: 'bool' },
    { key: 'reviewMonths', label: 'Review length override (months)', type: 'int' },
    { key: 'approval', label: 'Fixed FDA approval date', type: 'month' },
    { key: 'note', label: 'Note shown above the row', type: 'text' }
  ];

  var EVENT_KEYS = ['ssd', 'pcd', 'd', 's', 'fda', 'acip'];
  var EVENT_NAMES = { ssd: 'Study start', pcd: 'Primary completion', d: 'Data readout', s: 'Submission', fda: 'FDA approval', acip: 'ACIP' };

  // ---------- month helpers ----------
  function mi(year, month) { return year * 12 + (month - 1); }
  function yearOf(i) { return Math.floor(i / 12); }
  function monthOf(i) { return ((i % 12) + 12) % 12 + 1; }
  function yy(i) { var y = yearOf(i) % 100; return (y < 10 ? '0' : '') + y; }
  function quarterOf(i) { return Math.floor((monthOf(i) - 1) / 3) + 1; }
  function monthLabel(i) { return MONTHS[monthOf(i) - 1] + " '" + yy(i); }
  function quarterLabel(i) { return quarterOf(i) + "Q '" + yy(i); }
  function longMonth(i) { return MONTHS[monthOf(i) - 1] + ' ' + yearOf(i); }
  function toYM(i) { var m = monthOf(i); return yearOf(i) + '-' + (m < 10 ? '0' : '') + m; }

  function monthIndexOfName(name) {
    var n = String(name).slice(0, 3).toLowerCase();
    for (var k = 0; k < 12; k++) if (MONTHS[k].toLowerCase() === n) return k + 1;
    return 0;
  }
  function fullYear(y) { y = Number(y); return y < 100 ? 2000 + y : y; }

  /**
   * Reads a month from the many ways people type dates:
   * 2027-01, 2027/1, 01/2027, Jan 2027, Jan '27, Jan-27, January 2027, 4Q '26, Q4 2026, 1/15/2027,
   * an Excel serial date, or an existing month index. Quarters map to their middle month.
   * Returns a month index, or null when blank or unreadable.
   */
  function parseMonth(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return isFinite(v) ? Math.round(v) : null;
    var s = String(v).trim().replace(/[‘’`´]/g, "'");
    if (!s) return null;
    var m;
    if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})(?:[-\/.]\d{1,2})?$/))) return okMonth(+m[1], +m[2]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{4})$/))) return okMonth(+m[2], +m[1]);
    if ((m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/))) {
      // Day/month order is ambiguous; treat as month/day unless the first number cannot be a month.
      var a = +m[1], b = +m[2];
      return okMonth(fullYear(m[3]), a > 12 ? b : a);
    }
    if ((m = s.match(/^([A-Za-z]{3,9})\.?[\s\-,]*'?(\d{2}|\d{4})$/))) {
      var mon = monthIndexOfName(m[1]);
      return mon ? mi(fullYear(m[2]), mon) : null;
    }
    if ((m = s.match(/^\d{1,2}[\s\-]([A-Za-z]{3,9})[\s\-,]*'?(\d{2}|\d{4})$/))) {
      var mon2 = monthIndexOfName(m[1]);
      return mon2 ? mi(fullYear(m[2]), mon2) : null;
    }
    if ((m = s.match(/^([1-4])\s*Q\s*'?(\d{2}|\d{4})$/i)) || (m = s.match(/^Q\s*([1-4])\s*'?(\d{2}|\d{4})$/i))) {
      return mi(fullYear(m[2]), (+m[1] - 1) * 3 + 2);
    }
    if ((m = s.match(/^(\d{5})(?:\.\d+)?$/))) {
      var d = new Date(Date.UTC(1899, 11, 30) + Number(m[1]) * 86400000);
      return mi(d.getUTCFullYear(), d.getUTCMonth() + 1);
    }
    return null;
  }
  function okMonth(y, mo) { return (mo >= 1 && mo <= 12) ? mi(y, mo) : null; }

  /** Normalises a month value to 'YYYY-MM' (or '' when blank). Unreadable text is returned unchanged so it can be flagged. */
  function normMonth(v) {
    if (v === null || v === undefined || String(v).trim() === '') return '';
    var i = parseMonth(v);
    return i === null ? String(v).trim() : toYM(i);
  }

  function num(v, dflt) {
    if (v === '' || v === null || v === undefined) return dflt;
    var n = Number(v);
    return isFinite(n) ? n : dflt;
  }

  function nextAcip(fromIdx, months) {
    var list = (months && months.length ? months : DEFAULT_RULES.acipMonths)
      .map(Number).filter(function (x) { return x >= 1 && x <= 12; });
    if (!list.length) return null;
    for (var i = fromIdx; i < fromIdx + 36; i++) if (list.indexOf(monthOf(i)) >= 0) return i;
    return null;
  }

  function rulesOf(model) {
    var r = {}, k;
    for (k in DEFAULT_RULES) r[k] = DEFAULT_RULES[k];
    if (model && model.rules) for (k in model.rules) if (model.rules[k] !== undefined && model.rules[k] !== '') r[k] = model.rules[k];
    return r;
  }

  /**
   * Applies the rules to one scenario.
   * SSD + study length -> PCD; PCD + topline lag -> D; D + submission lag -> S (unless a fixed submission date is set);
   * S + review length (priority or standard) -> FDA approval (unless fixed); approval -> next ACIP meeting.
   */
  function computeScenario(sc, rules) {
    rules = rules || DEFAULT_RULES;
    var ev = { ssd: null, pcd: null, d: null, s: null, fda: null, acip: null };
    var warnings = [];

    var ssd = parseMonth(sc.ssd);
    if (sc.ssd && ssd === null) warnings.push('Could not read the study start "' + sc.ssd + '"');
    if (ssd !== null) {
      var len = num(sc.studyMonths, null);
      if (len === null || len < 0) { warnings.push('Study length is missing'); len = 0; }
      ev.ssd = ssd;
      ev.pcd = ssd + Math.round(len);
      if (sc.showReadout !== false) ev.d = ev.pcd + Math.round(num(sc.readoutLag, rules.readoutLag));
    }

    var subFixed = parseMonth(sc.submission);
    if (sc.submission && subFixed === null) warnings.push('Could not read the submission date "' + sc.submission + '"');
    if (subFixed !== null) ev.s = subFixed;
    else if (ev.d !== null) ev.s = ev.d + Math.round(num(sc.submissionLag, rules.submissionLag));
    else if (ev.pcd !== null) ev.s = ev.pcd + Math.round(num(sc.readoutLag, rules.readoutLag)) + Math.round(num(sc.submissionLag, rules.submissionLag));

    var review = Math.round(num(sc.reviewMonths, sc.priorityReview ? rules.reviewPriority : rules.reviewStandard));
    var apFixed = parseMonth(sc.approval);
    if (sc.approval && apFixed === null) warnings.push('Could not read the approval date "' + sc.approval + '"');
    if (apFixed !== null) ev.fda = apFixed;
    else if (ev.s !== null) ev.fda = ev.s + review;

    if (ev.fda !== null && sc.showAcip !== false) ev.acip = nextAcip(ev.fda + Math.round(num(rules.acipMinGap, 1)), rules.acipMonths);

    if (ev.d !== null && ev.s !== null && ev.s < ev.d) warnings.push('Submission is earlier than the data readout');
    if (ev.ssd !== null && ev.s !== null && ev.s < ev.ssd) warnings.push('Submission is earlier than the study start');
    if (ev.s !== null && ev.fda !== null && ev.fda <= ev.s) warnings.push('Approval is not after submission');
    if (ev.ssd === null && ev.s === null) warnings.push('Set a study start or a fixed submission date');

    return { id: sc.id, events: ev, review: review, warnings: warnings };
  }

  function computeAll(model) {
    var rules = rulesOf(model);
    return (model.scenarios || []).map(function (sc) { return computeScenario(sc, rules); });
  }

  /** Text labels in the slide's conventions (SSD/PCD/FDA/ACIP by month; D and S by quarter unless set to month). */
  function labels(ev, rules) {
    var pt = (rules && rules.pointLabels === 'month') ? monthLabel : quarterLabel;
    return {
      ssd: ev.ssd === null ? '' : 'SSD ' + monthLabel(ev.ssd),
      pcd: ev.pcd === null ? '' : 'PCD ' + monthLabel(ev.pcd),
      d: ev.d === null ? '' : pt(ev.d),
      s: ev.s === null ? '' : pt(ev.s),
      fda: ev.fda === null ? '' : 'FDA ' + monthLabel(ev.fda),
      acip: ev.acip === null ? '' : 'ACIP ' + monthLabel(ev.acip)
    };
  }

  // ---------- model helpers ----------
  function blankScenario(i) {
    return {
      id: 's' + (i + 1), name: 'Scenario ' + (i + 1), row: i,
      studyName: 'Ph3', ssd: '', studyMonths: 12, readoutLag: '', submissionLag: '',
      submission: '', priorityReview: false, reviewMonths: '', approval: '',
      showAcip: true, note: '', highlightAcip: false
    };
  }

  function normalizeModel(m) {
    m = m ? JSON.parse(JSON.stringify(m)) : {};
    m.schema = SCHEMA;
    if (!Array.isArray(m.scenarios)) m.scenarios = [];
    m.rules = Object.assign({}, DEFAULT_RULES, m.rules || {});
    if (!Array.isArray(m.rules.acipMonths)) m.rules.acipMonths = DEFAULT_RULES.acipMonths.slice();
    m.scenarios = m.scenarios.map(function (sc, i) {
      var b = blankScenario(i), out = Object.assign(b, sc);
      if (!out.id) out.id = 's' + (i + 1);
      if (out.row === undefined || out.row === null || out.row === '') out.row = i;
      ['ssd', 'submission', 'approval'].forEach(function (k) { out[k] = normMonth(out[k]); });
      return out;
    });
    if (m.showToday === undefined) m.showToday = true;
    if (!Array.isArray(m.changelog)) m.changelog = [];
    if (m.baseline === undefined) m.baseline = null;
    if (m.showSlippage === undefined) m.showSlippage = false;
    return m;
  }

  function snapshot(model, label) {
    var events = {};
    computeAll(model).forEach(function (r) {
      var e = {};
      EVENT_KEYS.forEach(function (k) { e[k] = r.events[k] === null ? '' : toYM(r.events[k]); });
      events[r.id] = e;
    });
    return { label: label || 'Baseline', savedAt: new Date().toISOString(), events: events };
  }

  /** Month differences between the current schedule and the saved baseline, per scenario and event. */
  function deltas(model) {
    var out = {};
    if (!model.baseline || !model.baseline.events) return out;
    computeAll(model).forEach(function (r) {
      var b = model.baseline.events[r.id];
      if (!b) return;
      var d = {};
      EVENT_KEYS.forEach(function (k) {
        var bi = parseMonth(b[k]), ci = r.events[k];
        d[k] = (bi === null || ci === null) ? null : ci - bi;
      });
      out[r.id] = { delta: d, base: b };
    });
    return out;
  }

      ])
    ];
    var more = h('details', { class: 'more', open: S.open['more-' + id] ? true : null }, [h('summary', { text: 'More inputs' })].concat(moreKids));
    more.addEventListener('toggle', function () { S.open['more-' + id] = more.open; });

    return h('section', { class: 'card', id: 'card-' + id }, [
      h('div', { class: 'card-head' }, [
        h('div', { class: 'card-title', title: sc.name, text: sc.name || id }),
        h('div', { class: 'shift' }, [
          h('button', { class: 'chip', title: 'Move this scenario 3 months earlier', onclick: function () { shiftScenario(id, -3); }, text: '−3 mo' }),
          h('button', { class: 'chip', title: 'Move this scenario 3 months later', onclick: function () { shiftScenario(id, 3); }, text: '+3 mo' })
        ])
      ]),
      h('div', { class: 'chain', id: 'chain-' + id }),
      h('div', { class: 'card-warn', id: 'warn-' + id }),
      main,
      more
    ]);
  }

  function refreshComputed() {
    if (!S.model) return;
    var rules = E.rulesOf(S.model);
    var dls = E.deltas(S.model);
    S.model.scenarios.forEach(function (sc) {
      var r = E.computeScenario(sc, rules);
      var L = E.labels(r.events, rules);
      var chain = $('chain-' + sc.id);
      if (chain) {
        chain.innerHTML = '';
        var dl = dls[sc.id];
        [['ssd', 'p-ssd'], ['pcd', 'p-pcd'], ['d', 'p-d', 'D '], ['s', 'p-s', 'S '], ['fda', 'p-fda'], ['acip', 'p-acip']].forEach(function (k, i, arr) {
          if (!L[k[0]]) return;
          var kids = [h('span', { text: (k[2] || '') + L[k[0]] })];
          var dv = dl ? dl.delta[k[0]] : null;
          if (k[0] === 'fda' && dv) kids.push(h('b', { class: dv > 0 ? 'late' : 'early', text: ' ' + (dv > 0 ? '+' : '−') + Math.abs(dv) + ' mo' }));
          chain.appendChild(h('span', { class: 'pill ' + k[1] }, kids));
        });
      }
      var w = $('warn-' + sc.id);
      if (w) { w.innerHTML = ''; r.warnings.forEach(function (t) { w.appendChild(h('div', { class: 'note warn', text: t })); }); }
    });
    var bt = $('baseTable');
    if (bt) fillBaselineTable(bt);
    var lc = $('logCount');
    if (lc) lc.textContent = S.model.changelog.length ? String(S.model.changelog.length) : '';
    var ll = $('logList');
    if (ll) fillLog(ll);
    $('btnUndo').disabled = !S.history.length;
  }

  // ---- team updates ----
  function teamView() {
    var paste = h('textarea', { id: 'paste', class: 'in', rows: '4', placeholder: 'Paste the team’s edited table here (straight from Excel, Teams or email)' });
    var copyOut = h('textarea', { id: 'copyOut', class: 'in mono hidden', rows: '4', readonly: true });
    var proposals = h('div', { id: 'proposals' });
    return section('team', 'Team updates', [
      h('p', { class: 'help', text: 'Send the inputs as a table, let the team edit dates, lengths or PRV (Y/N), paste it back and apply only the changes you accept. Each change is logged with its source.' }),
      h('div', { class: 'btns' }, [
        h('button', { class: 'btn', onclick: copyTable, text: 'Copy input table' }),
        h('button', { class: 'btn', onclick: copyTemplateNote, text: 'Copy note for the team' })
      ]),
      copyOut,
      paste,
      h('div', { class: 'btns' }, [h('button', { class: 'btn', onclick: function () { reviewPaste(paste.value); }, text: 'Review changes' })]),
      proposals
    ]);
  }

  function copyText(text, fallbackEl, what) {
    function fallback() {
      fallbackEl.classList.remove('hidden');
      fallbackEl.value = text;
      fallbackEl.focus(); fallbackEl.select();
      setStatus('Select-all is done: press Ctrl+C (⌘C on Mac) to copy the ' + what + '.', 'warn');
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { fallbackEl.classList.add('hidden'); setStatus('Copied the ' + what + ' to the clipboard.', 'ok'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function copyTable() { copyText(E.toTSV(S.model), $('copyOut'), 'input table'); }
  function copyTemplateNote() {
    var text = 'Timeline check-in: please update any inputs that have changed in the table below (dates like "Apr 2027", lengths in months, PRV as Y/N), add your source, and send it back.\n\n' + E.toTSV(S.model);
    copyText(text, $('copyOut'), 'note and table');
  }

  function reviewPaste(text) {
    var res = E.parseUpdates(S.model, text);
    S.proposed = res;
    var box = $('proposals');
    box.innerHTML = '';
    res.problems.forEach(function (p) { box.appendChild(h('div', { class: 'note warn', text: p })); });
    if (!res.changes.length) { box.appendChild(h('div', { class: 'note', text: res.problems.length ? 'No changes could be read.' : 'No differences from the current inputs.' })); return; }
    var list = h('div', { class: 'proposals' });
    res.changes.forEach(function (c, i) {
      var f = E.fieldByKey(c.key);
      list.appendChild(h('label', { class: 'proposal' }, [
        h('input', { type: 'checkbox', checked: true, 'data-i': String(i) }),
        h('span', {}, [h('b', { text: short(scName(c.id), 26) }), ' · ' + c.label + ': ', h('s', { text: E.fieldValueText(f, c.from) || 'blank' }), ' → ', h('b', { text: E.fieldValueText(f, c.to) || 'blank' })])
      ]));
    });
    box.appendChild(list);
    box.appendChild(h('div', { class: 'btns' }, [h('button', { class: 'btn primary', onclick: applyProposals, text: 'Apply checked changes' })]));
  }

  function applyProposals() {
    if (!S.proposed) return;
    var picked = Array.prototype.slice.call(document.querySelectorAll('#proposals input[type=checkbox]'))
      .filter(function (c) { return c.checked; }).map(function (c) { return S.proposed.changes[Number(c.getAttribute('data-i'))]; });
    if (!picked.length) return;
    var src = ($('src').value || '').trim() || 'Team update (pasted table)';
    var entries = picked.map(function (c) {
      var f = E.fieldByKey(c.key), e = entry(c.id, c.label, E.fieldValueText(f, c.from), E.fieldValueText(f, c.to));
      e.source = src;
      return e;
    });
    change(function (m) { picked.forEach(function (c) { findSc(c.id, m)[c.key] = c.to; }); }, entries, true);
    S.proposed = null;
    setStatus('Applied ' + picked.length + ' change' + (picked.length > 1 ? 's' : '') + ' from the team table.', 'ok');
  }

  // ---- baseline ----
  function baselineView() {
    var b = S.model.baseline;
    var label = h('input', { id: 'baseLabel', class: 'in', type: 'text', placeholder: 'e.g. Oct 2026 steering committee' });
    return section('baseline', 'Baseline and slippage', [
      h('p', { class: 'help', text: b ? 'Baseline “' + b.label + '”, saved ' + fmtTime(b.savedAt) + '.' : 'No baseline saved yet. Save one before a review to see what moved.' }),
      h('label', { class: 'check' }, [
        h('input', { type: 'checkbox', checked: !!S.model.showSlippage, disabled: b ? null : true, onchange: function (ev) {
          var v = ev.target.checked;
          change(function (m) { m.showSlippage = v; }, []);
        } }), ' Show slippage on the slide (hollow star at the baseline approval, ± months next to FDA)'
      ]),
      h('div', { id: 'baseTable' }),
      h('div', { class: 'row-inline' }, [label, h('button', { class: 'btn', onclick: function () {
        var name = label.value.trim() || ('Baseline ' + new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }));
        change(function (m) { m.baseline = E.snapshot(m, name); }, [entry('baseline', 'Saved baseline', '', name)], true);
      }, text: 'Save current as baseline' })])
    ]);
  }

  function fillBaselineTable(el) {
    el.innerHTML = '';
    var dls = E.deltas(S.model);
    if (!S.model.baseline) return;
    var rules = E.rulesOf(S.model);
    var t = h('table', { class: 'tbl' }, [h('tr', {}, [h('th', { text: 'Scenario' }), h('th', { text: 'FDA, baseline' }), h('th', { text: 'Now' }), h('th', { text: 'Δ' })])]);
    S.model.scenarios.forEach(function (sc) {
      var r = E.computeScenario(sc, rules), dl = dls[sc.id];
      var base = dl ? E.parseMonth(dl.base.fda) : null, now = r.events.fda;
      var d = (base !== null && now !== null) ? now - base : null;
      t.appendChild(h('tr', {}, [
        h('td', { text: short(sc.name, 20), title: sc.name }),
        h('td', { text: base !== null ? E.monthLabel(base) : '–' }),
        h('td', { text: now !== null ? E.monthLabel(now) : '–' }),
        h('td', { class: d > 0 ? 'late' : d < 0 ? 'early' : '', text: d === null ? '–' : d === 0 ? '0' : (d > 0 ? '+' : '−') + Math.abs(d) + ' mo' })
      ]));
    });
    el.appendChild(t);
  }

  // ---- rules ----
  function rulesView() {
    var r = E.rulesOf(S.model);
    function ruleNum(key, label, hint) {
      var inp = h('input', { type: 'text', inputmode: 'numeric', class: 'in num', value: String(r[key]) });
      inp.addEventListener('change', function () {
        var v = Math.round(Number(inp.value));
        if (!isFinite(v) || v < 0) { inp.value = String(E.rulesOf(S.model)[key]); return; }
        var old = E.rulesOf(S.model)[key];
        if (old === v) return;
        change(function (m) { m.rules[key] = v; }, [entry('rules', label, String(old), String(v))], true);
      });
      return row(label, h('div', { class: 'stepper' }, [inp, h('span', { class: 'suffix', text: hint })]));
    }
    var chips = h('div', { class: 'chips' }, E.MONTHS.map(function (mn, i) {
      var on = r.acipMonths.indexOf(i + 1) >= 0;
      return h('button', { class: 'chip' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', text: mn.charAt(0) + mn.slice(1, 3), onclick: function () {
        var cur = E.rulesOf(S.model).acipMonths.slice(), k = cur.indexOf(i + 1);
        if (k >= 0) cur.splice(k, 1); else cur.push(i + 1);
        cur.sort(function (a, b) { return a - b; });
        var label = function (a) { return a.map(function (x) { return E.MONTHS[x - 1]; }).join(', '); };
        change(function (m) { m.rules.acipMonths = cur; }, [entry('rules', 'ACIP meeting months', label(E.rulesOf(S.model).acipMonths), label(cur))], true);
      } });
    }));
    var asOf = h('input', { type: 'date', class: 'in', value: S.model.asOf || '' });
    asOf.addEventListener('change', function () { var v = asOf.value; change(function (m) { m.asOf = v; }, [entry('rules', 'Today line date', S.model.asOf || 'today', v || 'today')]); });
    var pl = h('select', { class: 'in' }, [h('option', { value: 'quarter', text: 'Quarter (4Q ’27)' }), h('option', { value: 'month', text: 'Month (Nov ’27)' })]);
    pl.value = r.pointLabels;
    pl.addEventListener('change', function () { var v = pl.value; change(function (m) { m.rules.pointLabels = v; }, [entry('rules', 'D and S labels', r.pointLabels, v)]); });
    return section('rules', 'Rules', [
      h('p', { class: 'help', text: 'Applied to every scenario. A blank scenario input uses these defaults.' }),
      h('div', { class: 'grid' }, [
        ruleNum('reviewPriority', 'Priority review', 'months, submission → approval'),
        ruleNum('reviewStandard', 'Standard review', 'months, submission → approval'),
        ruleNum('readoutLag', 'Topline', 'months after PCD'),
        ruleNum('submissionLag', 'Submission', 'months after topline'),
        row('ACIP meets in', chips),
        ruleNum('acipMinGap', 'ACIP vote', 'months after approval, at least'),
        row('D and S labels', pl),
        row('Today line', h('div', {}, [
          h('label', { class: 'check' }, [h('input', { type: 'checkbox', checked: S.model.showToday !== false, onchange: function (ev) { var v = ev.target.checked; change(function (m) { m.showToday = v; }, []); } }), ' Show']),
          asOf
        ]), 'Date blank = today')
      ])
    ]);
  }

  // ---- change log ----
  function logView() {
    return section('log', 'Change log', [
      h('div', { class: 'btns' }, [h('button', { class: 'btn', onclick: function () {
        var rows = [['When', 'By', 'Scenario', 'What', 'From', 'To', 'Source'].join('\t')].concat(S.model.changelog.map(function (e) {
          return [e.at, e.by, scName(e.id), e.what, e.from, e.to, e.source].map(function (x) { return String(x || '').replace(/[\t\n]/g, ' '); }).join('\t');
        }));
        copyText(rows.join('\n'), $('logOut'), 'change log');
      }, text: 'Copy log' })]),
      h('textarea', { id: 'logOut', class: 'in mono hidden', rows: '4', readonly: true }),
      h('ol', { id: 'logList', class: 'log' })
    ], h('span', { id: 'logCount', class: 'count' }));
  }

  function fillLog(el) {
    el.innerHTML = '';
    var items = S.model.changelog.slice(-80).reverse();
    if (!items.length) { el.appendChild(h('li', { class: 'empty', text: 'No changes yet. Edits made here are recorded with who made them and the source.' })); return; }
    items.forEach(function (e) {
      el.appendChild(h('li', {}, [
        h('div', { class: 'meta', text: fmtTime(e.at) + (e.by ? ' · ' + e.by : '') + ' · ' + short(scName(e.id), 30) }),
        h('div', {}, [e.what + ': ', e.from ? h('s', { text: e.from }) : null, e.from ? ' → ' : '', h('b', { text: e.to || 'blank' })]),
        e.source ? h('div', { class: 'src', text: e.source }) : null
      ]));
    });
  }

  // ---- slide setup ----
  function calText() {
    if (!S.cal) return S.calReason || 'No timeline table found.';
    var ax = S.cal.axis;
    return E.quarterLabel(ax.startMonth) + ' to ' + E.quarterLabel(ax.endMonth - 1) + ' · ' + S.cal.lanes.length + ' scenario rows · ' +
      (S.calSource === 'table' ? 'measured from the table' : S.calSource === 'saved' ? 'saved layout (table could not be measured)' : 'example layout');
  }

  function slideView() {
    if (S.mode === 'preview') {
      return section('slide', 'About this preview', [
        h('p', { class: 'help', text: 'This page runs the add-in’s engine and task pane against a picture of the slide. Inside PowerPoint the same pane draws native, editable shapes on the slide and saves its inputs in the slide itself.' }),
        h('p', { class: 'help', text: 'Timeline: ' + calText() }),
        h('div', { class: 'btns' }, [h('button', { class: 'btn', onclick: function () {
          S.model = E.normalizeModel(JSON.parse(S.initial)); S.history = []; renderAll(); setStatus('Preview reset to the original inputs.', 'ok');
        }, text: 'Reset preview' })])
      ]);
    }
    var legacyBox = h('div', { id: 'legacy' });
    return section('slide', 'Slide setup', [
      h('p', { class: 'help', text: 'Timeline: ' + calText() }),
      h('div', { class: 'btns' }, [
        h('button', { class: 'btn', onclick: function () { loadSlide(S.slideId); }, text: 'Re-read slide' }),
        h('button', { class: 'btn', onclick: findLegacy, disabled: S.cal ? null : true, text: 'Find hand-drawn shapes' }),
        h('button', { class: 'btn danger', onclick: removeTimeline, text: 'Remove live timeline' })
      ]),
      legacyBox,
      h('p', { class: 'help small', text: 'The add-in only touches shapes whose names start with “LTL|” (see Home › Arrange › Selection Pane). Inputs, baseline and change log are saved inside this slide.' })
    ]);
  }

  function findLegacy() {
    LT.ppt.findLegacy(S.slideId, S.cal).then(function (list) {
      S.legacy = list;
      var box = $('legacy');
      box.innerHTML = '';
      if (!list.length) { box.appendChild(h('div', { class: 'note', text: 'No hand-drawn timeline shapes found inside the table area.' })); return; }
      box.appendChild(h('div', { class: 'note warn', text: list.length + ' shapes are now selected on the slide (bars, markers and labels drawn by hand). Check the selection, then delete them so only the live timeline remains.' }));
      box.appendChild(h('div', { class: 'btns' }, [h('button', { class: 'btn danger', onclick: function () {
        LT.ppt.deleteShapes(S.slideId, S.legacy.map(function (s) { return s.id; })).then(function (n) {
          S.legacy = []; box.innerHTML = '';
          setStatus('Deleted ' + n + ' hand-drawn shapes.', 'ok');
          if (S.model) drawSlide();
        }).catch(showError);
      }, text: 'Delete these ' + list.length + ' shapes' })]));
    }).catch(showError);
  }

  function removeTimeline() {
    LT.ppt.removeAll(S.slideId).then(function (n) {
      setStatus('Removed the live timeline (' + n + ' shape groups) and its saved inputs from this slide.', 'ok');
      return loadSlide(S.slideId);
    }).catch(showError);
  }

  function setupView() {
    var kids = [];
    if (S.mode === 'ppt') {
      if (S.cal) {
        kids.push(h('p', { class: 'help', text: 'This slide has a timeline table (' + calText() + ').' }));
        kids.push(h('ul', { class: 'rows' }, (S.names || []).map(function (n, i) { return h('li', { text: n || ('Row ' + (i + 1)) }); })));
        kids.push(h('p', { class: 'help', text: 'If the timeline was drawn by hand, remove those shapes first so they are not left under the live version.' }));
        kids.push(h('div', { class: 'btns' }, [h('button', { class: 'btn', onclick: findLegacy, text: 'Find hand-drawn shapes' })]));
        kids.push(h('div', { id: 'legacy' }));
        kids.push(h('div', { class: 'btns' }, [
          h('button', { class: 'btn primary', onclick: function () { startModel(false); }, text: 'Start a live timeline for these rows' }),
          h('button', { class: 'btn', onclick: function () { startModel(true); }, text: 'Use example inputs' })
        ]));
      } else {
        kids.push(h('p', { class: 'help', text: S.calReason || 'No timeline table found on this slide.' }));
        kids.push(h('p', { class: 'help', text: 'Select a slide with a table whose header has years and quarters (like the filing-scenarios slide), then press Re-read slide.' }));
        kids.push(h('div', { class: 'btns' }, [h('button', { class: 'btn', onclick: function () { loadSlide(null); }, text: 'Re-read slide' })]));
      }
    }
    return h('section', { class: 'card setup' }, [h('div', { class: 'card-title', text: 'Set up this slide' })].concat(kids));
  }

  function startModel(example) {
    var names = S.names && S.names.length ? S.names : S.cal.lanes.map(function (_, i) { return 'Scenario ' + (i + 1); });
    var scen = names.map(function (n, i) {
      var b = E.blankScenario(i);
      b.name = n || b.name;
      if (example && LT.sample.model.scenarios[i]) { var ex = LT.sample.model.scenarios[i]; Object.keys(ex).forEach(function (k) { if (k !== 'name' && k !== 'id' && k !== 'row') b[k] = ex[k]; }); }
      else { b.studyName = ''; b.studyMonths = ''; }
      return b;
    });
    S.model = E.normalizeModel({ scenarios: scen, rules: LT.sample.model.rules });
    S.model.changelog.push(entry('rules', 'Started live timeline', '', example ? 'example inputs' : 'blank inputs'));
    S.history = [];
    S.open.scenarios = true;
    renderAll();
    drawSlide();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</head>
<body>
  <div id="app">
    <main id="stage" aria-label="Slide preview"></main>
    <aside id="pane" aria-label="Live Timeline">
      <header class="pane-head">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="5" width="9" height="5" rx="1" fill="#69B445"/><circle cx="12.5" cy="7.5" r="2.6" fill="#244EA2"/><path d="M15.6 2.2l.6 1.8h1.8l-1.5 1.1.6 1.8-1.5-1.1-1.5 1.1.6-1.8-1.5-1.1h1.8z" fill="#FFC709"/><line x1="1" y1="13.5" x2="17" y2="13.5" stroke="#9aa0a6" stroke-width="1"/></svg>
          <span>Live Timeline</span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite">Loading&hellip;</div>
      </header>
      <div class="toolbar">
        <button id="btnUpdate" class="btn primary">Update slide</button>
        <label class="check live"><input type="checkbox" id="chkLive" checked> Live</label>
        <button id="btnUndo" class="btn" disabled title="Undo the last change">Undo</button>
      </div>
      <div class="source">
        <label class="src">Source of changes<input id="src" class="in" type="text" placeholder="e.g. KOL call 14, 1 Oct"></label>
        <label class="by">By<input id="by" class="in" type="text" maxlength="6" placeholder="CD"></label>
      </div>
      <div id="content"></div>
      <div class="ver">Live Timeline v1.0.1</div>
    </aside>
  </div>
</body>
</html>
